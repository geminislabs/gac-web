# Entra con ESLint 10 (dev), que exige minimatch ^10.2.6 y aún no acepta 11.x;
# los patrones son los del propio repo, no de usuarios. Misma excepción que
# nexus-web-page. Quitarla cuando ESLint acepte minimatch 11.
[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-02T00:00:00Z
reason = "minimatch solo vía ESLint (dev), con patrones propios; ESLint aún no acepta 11.x. Quitar cuando lo acepte."
